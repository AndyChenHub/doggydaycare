<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https://raw.githubusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com; font-src 'self' data:; connect-src 'self' wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884 wss://test.mosquitto.org:8081 ws: http: https:; object-src 'none'; base-uri 'none'; form-action 'none';">
<title>Paws and Play — Doggy Daycare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paws and Play">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5d9d49">
<link rel="stylesheet" href="style.css?v=33">
</head>
<body>
<canvas id="game"></canvas>
<div id="tint"></div>
<div id="ui">
  <div id="hud-top">
    <div id="hud-tl" class="plaque">
      <div class="top-main-row">
        <button type="button" id="topTimePill" class="top-chip" title="Tap to expand daycare details">
          <span id="dayshort">🌅 D1</span>
          <span id="clock">8:00a</span>
        </button>
        <div class="stat-pill" id="repPill" title="Tap for Star Rating details"><span class="stars">★</span><span id="repShort">5.0</span></div>
        <button type="button" id="pupsPill" class="top-chip" title="Tap to expand Pups list">
          <span>🐕</span><span id="cap">0/2</span><span id="pupsAlert" class="top-alert"></span><span class="p-chev" id="pupsChev">▾</span>
        </button>
        <button type="button" id="tasksPill" class="top-chip" title="Tap to expand Goals &amp; Tutorial">
          <span id="tasksIco">🎯</span><span id="tasksShort">0/3</span><span class="p-chev" id="tasksChev">▾</span>
        </button>
        <div class="top-currencies">
          <div id="heartbox" title="Paw Hearts"><span class="hico">💛</span><span id="hearts">0</span></div>
          <div id="cashbox"><span class="coin"></span><span id="cash">$0</span></div>
        </div>
        <button type="button" id="topExpandBtn" class="top-exp-btn" title="Expand all top stats">▾</button>
      </div>
      <div id="topDetails" class="top-details" hidden>
        <div class="top-badges">
          <div id="sundial"><div id="sun"></div></div>
          <div class="clocktext"><span id="dayname">Day 1</span></div>
          <div class="stat-pill"><span class="lvnum" id="lvl">1</span><div class="bar"><div id="xpbar"></div></div></div>
          <div class="stat-pill" id="repFullPill"><span id="rep"></span></div>
          <div class="stat-pill" id="charmPill">🌸<span id="charm">0</span></div>
          <div class="stat-pill" id="streak"></div>
        </div>
      </div>
      <div class="daytrack"><div id="daybar"></div></div>
    </div>
    <div id="hud-tr" class="hud-pills-row">
      <div id="tasks" class="panel" hidden></div>
      <div id="roster" class="panel" hidden></div>
    </div>
    <div id="toasts"></div>
    <div id="mgBanner" hidden></div>
  </div>

  <div id="levelup"></div>
  <div id="banner"></div>

  <div id="hud-bottom">
    <div id="bottom-context">
      <div id="hint"></div>
      <button id="touchDropBtn" class="wood touch-btn" hidden>🐾 Drop</button>
    </div>
    <div id="buildpanel" class="panel" hidden></div>
    <div id="toolbar">
      <button id="buildBtn" class="wood"><span class="ico">🔨</span><span>Shop</span></button>
      <button id="dexBtn" class="wood"><span class="ico">📖</span><span>Breeds</span><i id="dexBadge" hidden></i></button>
      <button id="pauseBtn" class="wood"><span class="ico">☰</span><span>Menu</span></button>
    </div>
  </div>
</div>
<div id="modalwrap" hidden><div id="modal"></div></div>
<div id="netgate" hidden>
  <div class="card net-card">
    <div class="net-ico">📡</div>
    <h2 id="netTitle">Internet &amp; Cloud Sync Required</h2>
    <p id="netMsg">Paws &amp; Play requires an active internet connection so your daycare stays synced across phones.</p>
    <div class="net-status" id="netStatus">🔄 Connecting to Cloud Sync Server…</div>
    <div class="row">
      <button id="netRetryBtn" class="primary big">🔄 Reconnect Now</button>
    </div>
  </div>
</div>
<div id="fade"></div>
<div id="splash"><div class="logo">Paws &amp; Play<span>DOGGY DAYCARE</span></div><div class="paws"><i></i><i></i><i></i></div><p>Opening the doors…</p></div>
<!-- Bundled asset version marker: js/game.js?v=33 -->
<script src="js/boot.js?v=33"></script>
</body>
</html>
