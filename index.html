<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paws and Play — Doggy Daycare</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paws and Play">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5d9d49">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<canvas id="game"></canvas>
<div id="tint"></div>
<div id="ui">
  <div id="hud-top">
    <div id="hud-tl" class="plaque">
      <div class="top-main-row">
        <div id="sundial"><div id="sun"></div></div>
        <div class="clocktext"><span id="dayname">Day 1</span><span id="clock">8:00 AM</span></div>
        <div class="top-badges">
          <div class="stat-pill"><span class="lvnum" id="lvl">1</span><div class="bar"><div id="xpbar"></div></div></div>
          <div class="stat-pill" id="repPill"><span id="rep"></span></div>
          <div class="stat-pill">🐕<span id="cap">0/2</span></div>
          <div class="stat-pill" hidden>🌸<span id="charm">0</span></div>
          <div class="stat-pill" id="streak"></div>
        </div>
        <div id="cashbox"><span class="coin"></span><span id="cash">$0</span></div>
      </div>
      <div class="daytrack"><div id="daybar"></div></div>
    </div>
    <div id="hud-tr" class="hud-pills-row">
      <div id="tasks" class="panel"></div>
      <div id="roster" class="panel"></div>
    </div>
    <div id="toasts"></div>
  </div>

  <div id="levelup"></div>
  <div id="banner"></div>

  <div id="hud-bottom">
    <div id="bottom-context">
      <div id="hint"></div>
      <button id="touchDropBtn" class="wood touch-btn" hidden>🐾 Drop</button>
    </div>
    <div id="buildpanel" class="panel" hidden></div>
    <div id="toolbar">
      <button id="buildBtn" class="wood"><span class="ico">🔨</span><span>Shop</span></button>
      <button id="dexBtn" class="wood"><span class="ico">📖</span><span>Breeds</span><i id="dexBadge" hidden></i></button>
      <button id="pauseBtn" class="wood"><span class="ico">☰</span><span>Menu</span></button>
    </div>
  </div>
</div>
<div id="modalwrap" hidden><div id="modal"></div></div>
<div id="fade"></div>
<div id="splash"><div class="logo">Paws &amp; Play<span>DOGGY DAYCARE</span></div><div class="paws"><i></i><i></i><i></i></div><p>Opening the doors…</p></div>
<script src="js/config.js?v=13"></script>
<script src="js/data.js?v=13"></script>
<script src="js/breeds.js?v=13"></script>
<script src="js/sound.js?v=13"></script>
<script src="js/music.js?v=13"></script>
<script src="js/dogart.js?v=13"></script>
<script src="js/dogportrait.js?v=13"></script>
<script src="js/people.js?v=13"></script>
<script src="js/objects_a.js?v=13"></script>
<script src="js/objects_b.js?v=13"></script>
<script src="js/worldart.js?v=13"></script>
<script src="js/shopart.js?v=13"></script>
<script src="js/game.js?v=13"></script>
<script src="js/render.js?v=13"></script>
<script src="js/multiplayer.js?v=13"></script>
<script src="js/ui.js?v=13"></script>
</body>
</html>
